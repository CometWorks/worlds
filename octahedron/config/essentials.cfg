<?xml version="1.0" encoding="utf-8"?>
<PluginConfig xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
  <StationRefillEnabled>true</StationRefillEnabled>
  <StationLootContainerName>Station Loot</StationLootContainerName>
  <StationRefillLoot>true</StationRefillLoot>
  <StationHideLootContainers>true</StationHideLootContainers>
  <StationRefuelReactors>true</StationRefuelReactors>
  <StationRechargeBatteries>true</StationRechargeBatteries>
  <StationRefillGasTanks>true</StationRefillGasTanks>
  <StationAddIceToGasGenerators>false</StationAddIceToGasGenerators>
  <StationReloadTurrets>true</StationReloadTurrets>
  <RefillContainers>
    <RefillContainer>
      <ContainerName>Free Tools</ContainerName>
      <IntervalSeconds>60</IntervalSeconds>
      <Items>
        <RefillItem>
          <Item>PhysicalGunObject/Welder4Item</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>PhysicalGunObject/AngleGrinder4Item</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>PhysicalGunObject/HandDrill4Item</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>OxygenContainerObject/OxygenBottle</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>GasContainerObject/HydrogenBottle</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>ConsumableItem/Powerkit</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
      </Items>
    </RefillContainer>
    <RefillContainer>
      <ContainerName>Shipyard Reactor</ContainerName>
      <IntervalSeconds>60</IntervalSeconds>
      <Items>
        <RefillItem>
          <Item>Ingot/Uranium</Item>
          <MinimumAmount>1000</MinimumAmount>
        </RefillItem>
      </Items>
    </RefillContainer>
    <RefillContainer>
      <ContainerName>Shipyard Battery</ContainerName>
      <IntervalSeconds>60</IntervalSeconds>
      <Items />
    </RefillContainer>
  </RefillContainers>
</PluginConfig>

  <StationRechargeBatteries>true</StationRechargeBatteries>
  <StationRefillGasTanks>true</StationRefillGasTanks>
  <StationAddIceToGasGenerators>false</StationAddIceToGasGenerators>
  <StationReloadTurrets>true</StationReloadTurrets>
  <RefillContainers>
    <RefillContainer>
      <ContainerName>Free Tools</ContainerName>
      <IntervalSeconds>60</IntervalSeconds>
      <Items>
        <RefillItem>
          <Item>PhysicalGunObject/Welder2Item,PhysicalGunObject/Welder3Item</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>PhysicalGunObject/AngleGrinder2Item,PhysicalGunObject/AngleGrinder3Item</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>PhysicalGunObject/HandDrill2Item,PhysicalGunObject/HandDrill3Item</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>PhysicalGunObject/BinocularsItem</Item>
          <MinimumAmount>1</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>OxygenContainerObject/OxygenBottle</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>GasContainerObject/HydrogenBottle</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
        <RefillItem>
          <Item>ConsumableItem/Powerkit</Item>
          <MinimumAmount>3</MinimumAmount>
        </RefillItem>
      </Items>
    </RefillContainer>
    <RefillContainer>
      <ContainerName>Shipyard Reactor</ContainerName>
      <IntervalSeconds>600</IntervalSeconds>
      <Items>
        <RefillItem>
          <Item>Ingot/Uranium</Item>
          <MinimumAmount>10</MinimumAmount>
        </RefillItem>
      </Items>
    </RefillContainer>
    <RefillContainer>
      <ContainerName>Shipyard Battery</ContainerName>
      <IntervalSeconds>600</IntervalSeconds>
      <Items />
    </RefillContainer>
  </RefillContainers>
  <WorldEdgeEnabled>true</WorldEdgeEnabled>
  <WorldEdgeCenter>0 0 0</WorldEdgeCenter>
  <WorldEdgeRadius>500000</WorldEdgeRadius>
  <WorldEdgeBrakingRadius>450000</WorldEdgeBrakingRadius>
  <StarterShipEnabled>true</StarterShipEnabled>
  <ProjectionLimitsEnabled>true</ProjectionLimitsEnabled>
  <ClearTargetNeutralsEnabled>true</ClearTargetNeutralsEnabled>
  <OfflineCharacterMinutes>15</OfflineCharacterMinutes>
  <MoneyEnabled>true</MoneyEnabled>
  <MarketEnabled>true</MarketEnabled>
  <MarketCatalogExcluded>*/*Prototech*, */Scrap, Component/ZoneChip, Component/*Plushie*, Component/InhibitorChip</MarketCatalogExcluded>
  <ContractsEnabled>true</ContractsEnabled>
  <ContainerDropsPersonal>false</ContainerDropsPersonal>
  <EncountersEnabled>false</EncountersEnabled>
  <MesGateEnabled>true</MesGateEnabled>
</OctahedronConfig>

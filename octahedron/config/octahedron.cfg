  <DataPads>
    <DataPadEntry>
      <Title>Guild assay ledger</Title>
      <Text>Every gold claim this office has certified in fourteen years was filed on Earth. Off-world gold is a story prospectors tell in bars.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Smelter foreman's note</Title>
      <Text>Silver? Stay on the ground. The Earth deposits are the only ones the guild has ever logged.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Reactor supply memo</Title>
      <Text>All our uranium shipments carry the same origin stamp: the Moon. Nobody has found a trace of it anywhere else.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Ring miner's diary</Title>
      <Text>Platinum again today. Funny how it only ever turns up out here in the ring. The planets have none worth a drill bit.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Lunar survey, page 4</Title>
      <Text>Gold: none. We cored the Moon from pole to pole and the readings never moved.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Ring sweep report 12</Title>
      <Text>Sector sweep complete. No gold in any rock we scanned. Recommend we stop looking out here.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Lunar survey, page 9</Title>
      <Text>Silver: none detected in any lunar sample. Don't waste fuel on the Moon for it.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Ring sweep report 31</Title>
      <Text>Not a gram of silver in the ring. The spectrometer was checked twice.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Surface drilling log</Title>
      <Text>Forty bore holes on Earth and not one hint of uranium. Whatever feeds the reactors, it isn't dug up down here.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Ring sweep report 7</Title>
      <Text>Uranium count in the ring: zero. Every rock in the band came back clean.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Atmospheric core samples</Title>
      <Text>Results are in: there's no platinum anywhere on Earth. Pass it on so the new crews stop asking.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Lunar survey, page 17</Title>
      <Text>Platinum: none on the Moon. Several crews have looked and none of them found any.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Water hauler's log 1</Title>
      <Text>Found one of the big ice bodies in the ring. Enough water for a fleet.
{GPS:Octahedron-Ice-1:Ring ice A}</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Water hauler's log 2</Title>
      <Text>Marked another large ice rock out in the ring. Bring big tanks.
{GPS:Octahedron-Ice-2:Ring ice B}</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Water hauler's log 3</Title>
      <Text>A whole asteroid of ice sitting in the ring, right here.
{GPS:Octahedron-Ice-3:Ring ice C}</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Water hauler's log 4</Title>
      <Text>Last of the big ones I know of. Solid ice, all the way through.
{GPS:Octahedron-Ice-4:Ring ice D}</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Water board memo</Title>
      <Text>The survey charted four large ice asteroids in the ring. The haulers keep the coordinates to themselves, one each.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Elevator dispatch notice</Title>
      <Text>Fastest way between the ground and orbit: the space elevators at the poles. Their lowest gates hang about a kilometer above the ice, straight under North and South Station. Hover below the gate, dampeners off, and the lane lifts you up.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Hauler's logbook</Title>
      <Text>Burned half my hydrogen climbing out of Earth's air again. Next time I fly to a pole and take the elevator. The gate holds the ship up while it lines it up, and the ride to the station takes seconds.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Taxi rank memo</Title>
      <Text>The Earth Taxis at North and South Station go down the pole elevators and fly the rest on atmospheric thrusters. Calling one from the ground? It comes down the nearest elevator, and that's also how it brings you up.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Tug pilot's log</Title>
      <Text>Came in low past the Moon last night and saw something wrapped around a rock out there. Coiled like a corkscrew, with tools on it no shop I know of ever made. Swear I saw the arms move. The station crew just shrugged.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Dock clerk's note to new crews</Title>
      <Text>Seen the little ships with a grab on the nose buzzing around the station and the lane gates? Janitors. They pick up loose cargo floating out there and any scrap of under twenty blocks that nobody owns, and drop it in the shipyard's frame. An idle shipyard clears it away. When the yard is busy they wait beside it. Anything bigger they leave alone: that's salvage, and it's on the contract board.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Police duty handover</Title>
      <Text>You have the station this week. Park the Raptor on a station connector, not at the shipyard, which keeps its connectors off between jobs. Docked, the station fills your hydrogen tank and your guns for free. When anyone shoots at anything within two kilometers of the station, you'll hear about it. Chase them until they're three kilometers out, their weapons are dead, or they're gone. Then come home and dock.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Trader's warning</Title>
      <Text>Don't fire near a station, even back at someone who started it. I put a few rounds into a pirate a kilometer off the docks, and the police Raptors came out after both of us. They count any weapon hit within two kilometers. Hand guns don't set them off.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Salvager's letter home</Title>
      <Text>You asked how I pay the rent. Wreck contracts. Every station with a shipyard posts them with a GPS, and the wrecks can be anywhere. Tow one to within 150 meters of that station's shipyard, stay close, and keep everyone out of its seats. The board only lists wrecks worth 2,000 SC or more, and the pay is what the parts are worth when you get there, so don't strip it on the way. Then I keep the hull, or type !oct scrap within ten minutes and the station takes it apart. The pay is the same.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Debris crew memo</Title>
      <Text>Area cleanup contracts are for fields of small junk floating close together. You get a GPS point and a radius. Grind the pieces down or tow them out of the circle, and stay within five kilometers until the last one is gone. It pays what the pieces were worth. Loose cargo doesn't count, the janitors take that, and neither does anything that drifts in later.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Shipyard clerk's sticky note</Title>
      <Text>Building? Load your blueprint into the holo table and press the first button on the panel, Build. If you own less than 30,000 PCU, the ship is free, one at a time, with ten minutes between them. Otherwise the table shows the price first and you pay from your account. A paid ship waits in the queue for your turn: press Build then to start it, or it drops out. Press it while you're waiting and it cancels. Six orders fit in the queue, and you get one booking at a time.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Hauler's message to a friend</Title>
      <Text>Got the hull patched at the yard. Press Repair, the second button. You can park the wreck in the frame while you wait, the yard won't clear it away with your slot booked, though a build ahead of you shoves it out of the way. On your turn the welders go on and the station buys whatever parts they lack with your money, so no need to haul a second ship full of parts. Got some anyway? Dock it on a connector outside the frame and the welders use those first. Once there's nothing left to weld the slot ends, and you've got ten minutes to empty the containers.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Note taped inside a cockpit</Title>
      <Text>Found an NPC ship drifting? Press Hack, the third button at the yard, before you bring it in. Let go of it inside the frame, all of it, and wait sixty seconds. Then it's yours, subgrids too. It won't take a ship your faction owns or one whose owner is online, or one that puts you too far over your PCU.</Text>
    </DataPadEntry>
    <DataPadEntry>
      <Title>Scrapper's tip</Title>
      <Text>Grind is the fourth button. Book it before you bring the junk in, or an idle yard clears it away first. The grinders take apart what's in the frame that belongs to you, your faction, nobody or a wreck, cargo and all, and leave other players' ships alone. Dock your hauler on a yard connector: when the grinding is done the parts go into it, and the station buys what doesn't fit and pays you.</Text>
    </DataPadEntry>
  </DataPads>

<?xml version="1.0" encoding="utf-16"?>
<ToolCoreSettings xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
  <Version>0</Version>
  <!-- Off: ToolCore queues every block added or closed for its PCU count and never applies the queue,
       so a server keeps every grid it ever loaded in memory (SE-1149). The count isn't used anywhere. -->
  <RespectPlayerMaxPCU>false</RespectPlayerMaxPCU>
  <Materials>
    <MaterialData Category="Sand" Hardness="0.75" />
    <MaterialData Category="Snow" Hardness="0.8" />
    <MaterialData Category="Grass" Hardness="0.85" />
    <MaterialData Category="Soil" Hardness="0.9" />
    <MaterialData Category="Ice" Hardness="0.95" />
    <MaterialData Category="Rock" Hardness="1" />
    <MaterialData Category="Ore" Hardness="1" />
  </Materials>
</ToolCoreSettings>

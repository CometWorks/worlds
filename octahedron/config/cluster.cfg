# The cluster's handover config: deploy.py sets these on every deploy (SE-1074). The gateway keeps them and
# hands them to every node. Keys the file leaves out keep the cluster plugin's defaults.
#
# Offline partitions: a partition with no player within quietMeters for graceSeconds is saved and unloaded.
# When it wakes (a player comes near, joins, respawns there or calls it up by antenna), its production,
# power, fuel, gas and safe zone upkeep catch up for the time it was offline, at most compensateMaxHours.
# The cluster package ships the Concealment accounting core for this and loads it on every node; with the
# cluster in charge, Concealment's own concealment scans stay off.
offline.enabled = true
# Off until waking a long-offline partition is fast enough (SE-1096, SE-1104).
offline.compensate = false
offline.compensateMaxHours = 72

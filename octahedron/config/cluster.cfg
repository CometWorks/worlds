# The cluster's handover config: deploy.py sets these on every deploy (SE-1074). The gateway keeps them and
# hands them to every node. Keys the file leaves out keep the cluster plugin's defaults.
#
# Offline partitions: a partition with no player within quietMeters for graceSeconds is saved and unloaded.
# When it wakes (a player comes near, joins, respawns there or calls it up by antenna), its production,
# power, fuel, gas and safe zone upkeep catch up for the time it was offline, at most compensateMaxHours.
# The cluster package ships the Concealment accounting core for this and loads it on every node; with the
# cluster in charge, Concealment's own concealment scans stay off.
offline.enabled = true
# Off until waking a long-offline partition is fast enough (SE-1096, SE-1104).
offline.compensate = false
offline.compensateMaxHours = 72

# Unknown Signal drop containers (SE-1146): at most this many at a time for all players together, across the
# whole cluster; 0 = no cap. The World Authority also deletes the oldest drop GPS markers over it.
drops.maxActive = 5

# Bot ship cleanup (SE-1316): right after each cluster backup, remove up to botShipsMaxPerRun ships owned only by
# the sebot traders and taxi drivers and unused for botShipIdleMinutes; a ship with a player near stays. Their
# Steam IDs are fleet.json's client_id_base + n: traders from 76561202000000000, taxi drivers from
# 76561202000006000.
cleanup.botShips = on
cleanup.botSteamIds = 76561202000000000-76561202000009999

# New players: a player with no role yet gets Scripter on joining, so in-game scripts work for everyone, bots
# included. A role an admin set, None included, is kept. Needs cluster 0.3.7 or later: an older cluster refuses
# the whole config for an unknown key.
players.defaultRole = Scripter

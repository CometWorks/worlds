<Settings>
  <Version>2</Version>
  <EnableBoosting>true</EnableBoosting>
  <EnableGridGroups>true</EnableGridGroups>
  <IgnoreGridsWithoutThrust>true</IgnoreGridsWithoutThrust>
  <IgnoreGridsWithoutCockpit>false</IgnoreGridsWithoutCockpit>
  <ParachuteDeployHeight>1000</ParachuteDeployHeight>
  <SpeedLimit>360</SpeedLimit>
  <RemoteControlSpeedLimit>360</RemoteControlSpeedLimit>
  <LargeGrid>
    <CruiseCurve>
      <Point Mass="500000" Speed="250" />
      <Point Mass="5000000" Speed="175" />
      <Point Mass="10000000" Speed="100" />
    </CruiseCurve>
    <MaxBoostSpeed>300</MaxBoostSpeed>
    <ResistanceMultiplier>1.5</ResistanceMultiplier>
  </LargeGrid>
  <SmallGrid>
    <CruiseCurve>
      <Point Mass="50000" Speed="300" />
      <Point Mass="500000" Speed="200" />
      <Point Mass="1000000" Speed="100" />
    </CruiseCurve>
    <MaxBoostSpeed>360</MaxBoostSpeed>
    <ResistanceMultiplier>1.5</ResistanceMultiplier>
  </SmallGrid>
</Settings>
